name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04  # the newest image that still offers Python 3.9, which macOS ships
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The suite needs nothing installed. It also checks the rendered template's size.
      - run: python -m unittest discover -s tests
